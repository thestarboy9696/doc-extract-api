name = "doc-extract-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Secrets (set via `wrangler secret put <NAME>`, never committed):
#   ANTHROPIC_API_KEY
#   CDP_API_KEY_ID       (only needed once X402_NETWORK below is "base" — see README)
#   CDP_API_KEY_SECRET

[vars]
ANTHROPIC_MODEL = "claude-sonnet-5"
X402_PAY_TO_ADDRESS = "0x65c767C483dd862d08Bc3d6500Cd4CD770Ae28ED"
X402_NETWORK = "base"
# Per-route, not a shared price: matched to the lowest verified live-402 price from a direct
# competitor per category (checked Sep 2026 — see git history for the exact listings and prices).
# Contract's real comparable (legal-clause-extractor.pdfextractapi.workers.dev) is priced a cent
# higher than the invoice/receipt/resume/custom comparables, hence the split instead of one var.
X402_INVOICE_PRICE = "$0.02"
X402_RECEIPT_PRICE = "$0.02"
X402_CONTRACT_PRICE = "$0.03"
X402_RESUME_PRICE = "$0.02"
X402_CUSTOM_PRICE = "$0.02"
